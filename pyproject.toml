[project]
name = "dexpro"
version = "0.1.0"
description = "Turn your DeX into a professional setup."
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2",
]

[project.scripts]
dexpro = "app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
